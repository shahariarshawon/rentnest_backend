      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: bedrooms
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: amenities
        in: query
        required: false
        schema:
          type: string
          description: Comma-separated amenities, for example wifi,parking
      - name: sortBy
        in: query
        required: false
