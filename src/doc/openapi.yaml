openapi: 3.0.3
info:
  title: RentNest Rental Property Marketplace API
  version: 1.1.0
  description: REST API for tenant, landlord, and admin workflows with JWT authentication, Prisma/PostgreSQL persistence,
    and verified Stripe Checkout payments.
servers:
- url: http://localhost:5000
  description: Local development
- url: https://your-rentnest-domain.vercel.app
  description: Replace with the deployed Vercel URL
tags:
- name: Health
- name: Authentication
- name: Users
- name: Categories
- name: Properties
- name: Rentals
- name: Payments
- name: Reviews
- name: Admin
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - errorDetails
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorDetails:
          nullable: true
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum:
          - TENANT
          - LANDLORD
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - BANNED
    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        address:
          type: string
        city:
          type: string
        area:
          type: string
          nullable: true
        price:
          type: number
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        amenities:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
    RentalRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        moveInDate:
          type: string
          format: date-time
        durationMonths:
          type: integer
        totalAmount:
          type: number
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - ACTIVE
          - COMPLETED
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          nullable: true
        stripeSessionId:
          type: string
          nullable: true
        amount:
          type: number
        currency:
          type: string
          example: usd
        provider:
          type: string
          enum:
          - STRIPE
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
        paidAt:
          type: string
          format: date-time
          nullable: true
paths:
  /api/health:
    get:
      tags:
      - Health
      summary: Check API health
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register as tenant or landlord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: &id001
                  type: string
                email: &id002
                  type: string
                  format: email
                password: &id003
                  type: string
                  format: password
                  minLength: 8
                phone: *id001
                role:
                  type: string
                  enum:
                  - TENANT
                  - LANDLORD
              required:
              - name
              - email
              - password
              - role
      responses:
        '201':
          description: Registration completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation or business-rule error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id002
                password:
                  type: string
                  format: password
              required:
              - email
              - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation or business-rule error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Get authenticated user
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/users/profile:
    get:
      tags:
      - Users
      summary: Get own profile
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
